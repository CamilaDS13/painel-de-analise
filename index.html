<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qual vamos analisar hoje?</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Vanilla Tilt para Efeito 3D Interativo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .card-tilt { transform-style: preserve-3d; transform: perspective(1000px); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-8">
        
        <!-- Título Principal -->
        <div class="text-center md:text-left space-y-2">
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">Qual vamos analisar hoje?</h1>
            <p class="text-slate-500 text-sm md:text-base">Selecione um painel de dados para visualizar o relatório interativo completo.</p>
        </div>

        <!-- Filtros Rápidos -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0" id="category-filters">
                <button onclick="filterCategory('all')" class="cat-btn active bg-indigo-600 text-white font-medium px-4 py-2 rounded-xl text-sm transition-all shrink-0">Todos</button>
                <button onclick="filterCategory('fav')" class="cat-btn bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium px-4 py-2 rounded-xl text-sm transition-all shrink-0">⭐ Favoritos</button>
                <button onclick="filterCategory('E-commerce')" class="cat-btn bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium px-4 py-2 rounded-xl text-sm transition-all shrink-0">E-commerce</button>
                <button onclick="filterCategory('Vendas')" class="cat-btn bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium px-4 py-2 rounded-xl text-sm transition-all shrink-0">Vendas</button>
                <button onclick="filterCategory('Promoções')" class="cat-btn bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium px-4 py-2 rounded-xl text-sm transition-all shrink-0">Promoções</button>
                <button onclick="filterCategory('Logística')" class="cat-btn bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium px-4 py-2 rounded-xl text-sm transition-all shrink-0">Logística</button>
            </div>
            <div class="relative w-full sm:w-72">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Pesquisar relatório..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 transition-all">
            </div>
        </div>

        <!-- Grid de Cards de Relatórios -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="dashboards-grid">
            <!-- Cards gerados via JS -->
        </div>

    </div>

    <!-- Modal Iframe para Visualização Direta -->
    <div id="reportModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-6xl h-[90vh] flex flex-col shadow-2xl overflow-hidden border border-slate-200">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-white">
                <div class="flex items-center gap-3">
                    <div id="modalIcon" class="p-2 bg-indigo-50 rounded-xl text-indigo-600"></div>
                    <div>
                        <h3 id="modalTitle" class="font-bold text-slate-900 text-base"></h3>
                        <p id="modalCategory" class="text-xs text-slate-400"></p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <a id="modalExternalLink" href="#" target="_blank" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-indigo-600 bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-xl transition-all">
                        Abrir na Web <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                    </a>
                    <button onclick="closeModal()" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition-all">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div class="flex-1 bg-slate-50 relative">
                <iframe id="modalIframe" class="w-full h-full border-0" src=""></iframe>
            </div>
        </div>
    </div>

    <script>
        const dashboardsData = [
            {
                id: "ruptura",
                title: "Ruptura da loja online",
                category: "E-commerce",
                icon: "alert-triangle",
                url: "https://camilads13.github.io/RUPTURAS-DE-COMPRAS-VIP-COMMERCE/",
                desc: "Análise de indisponibilidade e falhas de estoque em itens."
            },
            {
                id: "embarcacoes",
                title: "Venda das embarcações",
                category: "Vendas",
                icon: "ship",
                url: "https://camilads13.github.io/Vendas-das-Embarca-es/",
                desc: "Acompanhamento detalhado do desempenho de vendas marítimas."
            },
            {
                id: "carrinho",
                title: "Abandono de carrinho",
                category: "E-commerce",
                icon: "shopping-cart",
                url: "https://camilads13.github.io/abandono-de-carrinho-no-app-e-site/",
                desc: "Métricas de carrinhos não finalizados no app e site."
            },
            {
                id: "cupons",
                title: "Cupons de desconto",
                category: "Promoções",
                icon: "ticket",
                url: "https://camilads13.github.io/cupons-de-desconto/",
                desc: "Relatório de adesão, impacto e conversão dos cupons."
            },
            {
                id: "dobradas",
                title: "Datas dobradas",
                category: "Promoções",
                icon: "calendar",
                url: "https://camilads13.github.io/liquida-app/",
                desc: "Resultados e pico de vendas em campanhas do tipo 5.5, 6.6, etc."
            },
            {
                id: "frete-especial",
                title: "Frete especial",
                category: "Logística",
                icon: "truck",
                url: "https://camilads13.github.io/FRETE-ESPECIAL/",
                desc: "Desempenho de campanhas com condições diferenciadas de frete."
            },
            {
                id: "frete-campanhas-2026",
                title: "Campanhas de Frete VIP Commerce (2026)",
                category: "Logística",
                icon: "package-check",
                url: "https://camilads13.github.io/Campanhas-de-frete-realizados-na-vipcommerce-em-2026/",
                desc: "Consolidado de todas as ações de frete realizadas em 2026."
            }
        ];

        let favorites = JSON.parse(localStorage.getItem('portal_favs') || '[]');
        let currentFilter = 'all';

        function renderCards(items) {
            const container = document.getElementById('dashboards-grid');
            container.innerHTML = '';

            items.forEach(item => {
                const isFav = favorites.includes(item.id);
                const card = document.createElement('div');
                card.className = "card-tilt bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between group cursor-pointer relative";
                card.setAttribute('ondblclick', `openModal('${item.id}')`);

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-3 mb-4">
                            <div class="p-3 bg-indigo-50 text-indigo-600 rounded-xl group-hover:bg-indigo-600 group-hover:text-white transition-all duration-300">
                                <i data-lucide="${item.icon}" class="w-6 h-6"></i>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="toggleFav(event, '${item.id}')" class="p-1.5 rounded-lg text-slate-300 hover:text-amber-400 transition-colors">
                                    <i data-lucide="star" class="w-5 h-5 ${isFav ? 'fill-amber-400 text-amber-400' : ''}"></i>
                                </button>
                                <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full">${item.category}</span>
                            </div>
                        </div>

                        <h3 class="font-bold text-slate-900 text-lg group-hover:text-indigo-600 transition-colors">${item.title}</h3>
                        <p class="text-slate-500 text-xs mt-1.5 line-clamp-2">${item.desc}</p>
                    </div>

                    <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between gap-2">
                        <button onclick="openModal('${item.id}')" class="flex-1 bg-slate-50 hover:bg-indigo-50 text-slate-700 hover:text-indigo-600 font-semibold text-xs py-2.5 rounded-xl border border-slate-200 hover:border-indigo-200 transition-all flex items-center justify-center gap-1.5">
                            <i data-lucide="eye" class="w-4 h-4"></i> Visualizar Relatório
                        </button>
                        <a href="${item.url}" target="_blank" class="p-2.5 text-slate-400 hover:text-indigo-600 hover:bg-slate-100 rounded-xl transition-all" title="Abrir em nova aba">
                            <i data-lucide="external-link" class="w-4 h-4"></i>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });

            lucide.createIcons();
            VanillaTilt.init(document.querySelectorAll(".card-tilt"), { max: 8, speed: 400, "max-glare": 0.1 });
        }

        function toggleFav(e, id) {
            e.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('portal_favs', JSON.stringify(favorites));
            applyFilters();
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'active');
                btn.classList.add('bg-slate-100', 'text-slate-600');
            });
            event.target.classList.add('bg-indigo-600', 'text-white', 'active');
            event.target.classList.remove('bg-slate-100', 'text-slate-600');
            applyFilters();
        }

        function handleSearch() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = dashboardsData;

            if (currentFilter === 'fav') {
                filtered = filtered.filter(d => favorites.includes(d.id));
            } else if (currentFilter !== 'all') {
                filtered = filtered.filter(d => d.category === currentFilter);
            }

            if (query) {
                filtered = filtered.filter(d => d.title.toLowerCase().includes(query) || d.desc.toLowerCase().includes(query));
            }

            renderCards(filtered);
        }

        function openModal(id) {
            const item = dashboardsData.find(d => d.id === id);
            if (!item) return;

            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalCategory').innerText = item.category;
            document.getElementById('modalIcon').innerHTML = `<i data-lucide="${item.icon}" class="w-5 h-5"></i>`;
            document.getElementById('modalExternalLink').href = item.url;

            // ADICIONA TIMESTAMP PARA EVITAR PROBLEMAS DE CACHE NO IFRAME
            const cacheBustUrl = item.url + (item.url.includes('?') ? '&' : '?') + 'v=' + Date.now();
            document.getElementById('modalIframe').src = cacheBustUrl;

            document.getElementById('reportModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('reportModal').classList.add('hidden');
            document.getElementById('modalIframe').src = '';
        }

        window.onload = function() {
            renderCards(dashboardsData);
        };
    </script>
</body>
</html>
