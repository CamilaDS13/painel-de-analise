<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Análise de Dados | Pinheiro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #f38218;
            --dark-blue: #161245;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--orange);
            font-family: 'Open Sans', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .bg-curve {
            position: fixed;
            right: 0;
            top: 0;
            height: 100%;
            width: 55%;
            background-color: var(--dark-blue);
            clip-path: ellipse(100% 100% at 100% 50%);
            z-index: 1;
        }

        .container {
            width: 95%;
            max-width: 1800px;
            height: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            padding: 40px 0;
        }

        header {
            margin-bottom: 20px;
            padding-left: 20px;
        }
        header h1 {
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            font-size: 55px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.3);
        }

        .main-content {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .dashboard-frame {
            background-color: var(--dark-blue);
            flex: 1.4;
            height: 80%;
            min-height: 550px;
            border-radius: 60px;
            padding: 40px;
            border: 8px solid var(--white);
            display: flex;
            gap: 25px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5);
            animation: floatFrame 4s ease-in-out infinite;
        }

        @keyframes floatFrame {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .vessel-col { flex: 0.8; }
        .card-large {
            background: var(--white);
            height: 100%;
            border-radius: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .card-large h2 {
            color: var(--dark-blue);
            font-family: 'Montserrat', sans-serif;
            font-size: 26px;
            margin-bottom: 20px;
            line-height: 1.1;
        }
        .icon-ship { font-size: 110px; }

        .grid-small {
            flex: 2;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 25px;
        }

        .card-small {
            background: var(--white);
            border-radius: 40px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: all 0.3s ease;
            text-align: center;
            border: 3px solid transparent;
        }

        .card-small span {
            color: var(--dark-blue);
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            margin-top: 15px;
            line-height: 1.2;
        }

        .card-icon { font-size: 45px; }

        .card-large:hover, .card-small:hover {
            transform: scale(1.05);
            border-color: #f38218;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .mascot-area {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            height: 100%;
            padding-right: 20px;
        }

        .mascot-img {
            max-height: 85vh;
            width: auto;
            z-index: 10;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
            animation: floatMascot 5s ease-in-out infinite;
        }

        @keyframes floatMascot {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(1deg); }
        }

        footer {
            margin-top: auto;
            padding-left: 20px;
            z-index: 10;
        }
        .footer-logo {
            width: 300px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
        }

    </style>
</head>
<body>

    <div class="bg-curve"></div>

    <div class="container">
        <header>
            <h1>Painel de Análise de Dados</h1>
        </header>

        <div class="main-content">
            <div class="dashboard-frame">
                
                <div class="vessel-col">
                    <a href="https://camilads13.github.io/Vendas-das-Embarca-es/" class="card-large">
                        <h2>VENDA<br>EMBARCAÇÕES</h2>
                        <div class="icon-ship">🚢</div>
                    </a>
                </div>

                <div class="grid-small">
                    <a href="https://camilads13.github.io/Campanhas-de-frete-realizados-na-vipcommerce-em-2026/" class="card-small">
                        <div class="card-icon">🚚</div>
                        <span>CAMPANHAS<br>DE FRETE</span>
                    </a>
                    <a href="https://camilads13.github.io/RUPTURAS-DE-COMPRAS-VIP-COMMERCE/" class="card-small">
                        <div class="card-icon">⚠️</div>
                        <span>CONTROLE<br>DE RUPTURA</span>
                    </a>
                    <a href="https://camilads13.github.io/abandono-de-carrinho-no-app-e-site/" class="card-small">
                        <div class="card-icon">🛒</div>
                        <span>ABANDONO<br>DE CARRINHO</span>
                    </a>
                    <a href="https://camilads13.github.io/liquida-app/" class="card-small">
                        <div class="card-icon">📅</div>
                        <span>DATAS<br>DOBRADAS</span>
                    </a>
                    <a href="https://camilads13.github.io/cupons-de-desconto/" class="card-small">
                        <div class="card-icon">🎟️</div>
                        <span>CUPONS DE<br>DESCONTO</span>
                    </a>
                    <a href="https://camilads13.github.io/indique-e-ganhe/" class="card-small">
                        <div class="card-icon">🤝</div>
                        <span>INDIQUE<br>E GANHE</span>
                    </a>
                </div>
            </div>

            <div class="mascot-area">
                <!-- Link CDN jsDelivr apontando para o seu repo de imagens -->
                <img src="https://cdn.jsdelivr.net/gh/CamilaDS13/imagens@Principal/mascote.png" class="mascot-img" alt="Mascote Pinheiro">
            </div>
        </div>

        <footer>
            <!-- Link CDN jsDelivr apontando para o seu repo de imagens -->
            <img src="https://cdn.jsdelivr.net/gh/CamilaDS13/imagens@Principal/logobranca.png" class="footer-logo" alt="Supermercado Pinheiro">
        </footer>
    </div>

</body>
</html>
